name: CI
on:
  push:

defaults:
  run:
    shell: bash

env:
  RG_VERSION: 15.0.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          env-vars: RG_VERSION
      - run: cargo install ripgrep@$RG_VERSION
      - run: rg --version
